<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 한마디</title>
  <meta name="description" content="나이, 성별, 오늘의 기분으로 오늘을 보내는 짧은 격언을 고릅니다.">

  <script src="js/theme.js"></script>
</head>
<body>

  <header class="top_bar">
    <div class="top_bar_inner">
      <p class="brand">
        <svg class="icon" aria-hidden="true"><use href="#icon_dark_mode"/></svg>
        <span>Today</span>
      </p>
      <button id="theme_toggle" class="theme_toggle" type="button">
        <span class="theme_label theme_label_to_light">
          <svg class="icon" aria-hidden="true"><use href="#icon_light_mode"/></svg>
          화이트 모드로 보기
        </span>
        <span class="theme_label theme_label_to_dark">
          <svg class="icon" aria-hidden="true"><use href="#icon_dark_mode"/></svg>
          다크 모드로 보기
        </span>
      </button>
    </div>
  </header>

  <main class="stage">
    <section class="intro">
      <p class="intro_chip">심야의 서신</p>
      <h1>오늘의 한마디</h1>
      <p class="subtitle">오늘 밤, 당신에게 건네는 한 문장</p>
    </section>

    <div class="layout">
      <section class="panel" aria-label="오늘의 정보 입력">
        <form id="fortune_form" autocomplete="off" novalidate>
          <div class="field">
            <label for="age_input">나이</label>
            <div class="age_box">
              <input id="age_input" name="age" type="number" inputmode="numeric" min="1" max="120" step="1" placeholder="예: 29">
              <span class="age_unit" aria-hidden="true">세</span>
            </div>
          </div>

          <fieldset class="field">
            <legend>성별</legend>
            <div class="choice_row">
              <label class="choice" for="gender_female">
                <input id="gender_female" type="radio" name="gender" value="female">
                <span>여성</span>
              </label>
              <label class="choice" for="gender_male">
                <input id="gender_male" type="radio" name="gender" value="male">
                <span>남성</span>
              </label>
              <label class="choice" for="gender_none">
                <input id="gender_none" type="radio" name="gender" value="none">
                <span>선택 안 함</span>
              </label>
            </div>
            <p class="field_hint">성별은 문장 내용이 아니라 카드 색에만 반영됩니다.</p>
          </fieldset>

          <fieldset class="field">
            <legend>오늘의 기분</legend>
            <div class="mood_grid">
              <label class="choice" for="mood_joy">
                <input id="mood_joy" type="radio" name="mood" value="joy">
                <span>기쁨</span>
              </label>
              <label class="choice" for="mood_calm">
                <input id="mood_calm" type="radio" name="mood" value="calm">
                <span>평온</span>
              </label>
              <label class="choice" for="mood_excited">
                <input id="mood_excited" type="radio" name="mood" value="excited">
                <span>설렘</span>
              </label>
              <label class="choice" for="mood_anxious">
                <input id="mood_anxious" type="radio" name="mood" value="anxious">
                <span>불안</span>
              </label>
              <label class="choice" for="mood_tired">
                <input id="mood_tired" type="radio" name="mood" value="tired">
                <span>피곤</span>
              </label>
              <label class="choice" for="mood_sad">
                <input id="mood_sad" type="radio" name="mood" value="sad">
                <span>우울</span>
              </label>
            </div>
          </fieldset>

          <p id="form_message" class="form_message" role="alert"></p>

          <button id="draw_button" class="button button_primary" type="submit">
            <svg class="icon" aria-hidden="true"><use href="#icon_auto_awesome"/></svg>
            <span>오늘의 문장 뽑기</span>
          </button>
        </form>
      </section>

      <article id="result_card" class="result_card">
        <div class="card_inner">
          <div id="card_head" class="card_head" hidden>
            <div>
              <p class="card_kicker">천궁의 운율</p>
              <p class="card_date">
                <span id="card_date"></span>
                <span aria-hidden="true">·</span>
                <span id="card_meta"></span>
              </p>
            </div>
            <p class="mood_chip">
              <span class="mood_chip_dot" aria-hidden="true"></span>
              <span id="card_mood"></span>
            </p>
          </div>

          <div class="card_vignette">
            <img src="images/night_sky.jpg" alt="" width="512" height="279">
            <p class="vignette_caption">
              <svg class="icon" aria-hidden="true"><use href="#icon_bedtime"/></svg>
              성찰의 밤
            </p>
          </div>

          <p id="card_empty" class="card_empty">나이, 성별, 오늘의 기분을 고르면 오늘을 위한 짧은 문장이 여기에 나타납니다.</p>

          <div id="card_body" class="card_body" hidden>
            <h2 class="card_title">오늘의 격언</h2>

            <div class="verse verse_lead" aria-live="polite">
              <p class="verse_label">
                <svg class="icon" aria-hidden="true"><use href="#icon_nights_stay"/></svg>
                하루를 보내는 태도
              </p>
              <p id="card_lead" class="sentence sentence_lead" tabindex="-1"></p>
            </div>

            <div class="verse verse_caution" aria-live="polite">
              <p class="verse_label">
                <svg class="icon" aria-hidden="true"><use href="#icon_wb_twilight"/></svg>
                마음에 둘 주의점
              </p>
              <p id="card_caution" class="sentence sentence_caution"></p>
            </div>

            <p class="star_divider" aria-hidden="true">✦</p>

            <div class="button_row">
              <button id="redraw_button" class="button button_ghost" type="button" disabled>
                <svg class="icon" aria-hidden="true"><use href="#icon_cached"/></svg>
                <span>다른 문장 보기</span>
              </button>
              <button id="copy_button" class="button button_ghost" type="button" disabled>
                <svg class="icon" aria-hidden="true"><use href="#icon_content_copy"/></svg>
                <span>문장 복사</span>
              </button>
            </div>
          </div>

          <p id="status_message" class="status_message" role="status"></p>
        </div>
      </article>
    </div>

    <footer class="epilogue">
      <p>밤하늘의 별처럼 삶의 길을 밝히는 한 줄의 성찰</p>
      <p class="epilogue_stars" aria-hidden="true">· · · ✦ · · ·</p>
    </footer>
  </main>

  <script src="js/phrases_general.js"></script>
  <script src="js/phrases_child.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/picker.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
