<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 한마디</title>
  <meta name="description" content="나이, 성별, 오늘의 기분으로 오늘을 보내는 짧은 격언을 고릅니다.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="stage">
    <header class="hero">
      <p class="brand_seal" aria-hidden="true">言</p>
      <h1>오늘의 한마디</h1>
      <p class="subtitle">나이와 오늘의 기분을 고르면, 오늘을 보내는 법과 조심할 일을 한두 문장으로 들려줍니다.</p>
    </header>

    <div class="layout">
      <section class="panel" aria-labelledby="form_title">
        <h2 id="form_title">오늘을 알려 주세요</h2>
        <form id="fortune_form" autocomplete="off" novalidate>
          <div class="field">
            <label for="age_input">나이</label>
            <input id="age_input" name="age" type="number" inputmode="numeric" min="1" max="120" step="1" placeholder="예: 29" aria-describedby="age_hint">
            <p id="age_hint" class="field_hint">1부터 120까지 숫자로 입력합니다.</p>
          </div>

          <fieldset class="field">
            <legend>성별</legend>
            <div class="choice_row">
              <label class="choice" for="gender_female">
                <input id="gender_female" type="radio" name="gender" value="female">
                <span>여성</span>
              </label>
              <label class="choice" for="gender_male">
                <input id="gender_male" type="radio" name="gender" value="male">
                <span>남성</span>
              </label>
              <label class="choice" for="gender_none">
                <input id="gender_none" type="radio" name="gender" value="none">
                <span>선택 안 함</span>
              </label>
            </div>
            <p id="gender_hint" class="field_hint">성별은 문장 내용이 아니라 카드 색에만 반영됩니다.</p>
          </fieldset>

          <fieldset class="field">
            <legend>오늘의 기분</legend>
            <div class="mood_grid">
              <label class="choice" for="mood_joy">
                <input id="mood_joy" type="radio" name="mood" value="joy">
                <span>기쁨</span>
              </label>
              <label class="choice" for="mood_calm">
                <input id="mood_calm" type="radio" name="mood" value="calm">
                <span>평온</span>
              </label>
              <label class="choice" for="mood_excited">
                <input id="mood_excited" type="radio" name="mood" value="excited">
                <span>설렘</span>
              </label>
              <label class="choice" for="mood_anxious">
                <input id="mood_anxious" type="radio" name="mood" value="anxious">
                <span>불안</span>
              </label>
              <label class="choice" for="mood_tired">
                <input id="mood_tired" type="radio" name="mood" value="tired">
                <span>피곤</span>
              </label>
              <label class="choice" for="mood_sad">
                <input id="mood_sad" type="radio" name="mood" value="sad">
                <span>우울</span>
              </label>
            </div>
          </fieldset>

          <div class="message_slot">
            <p id="form_message" class="form_message" role="alert"></p>
            <p id="status_message" class="status_message" role="status"></p>
          </div>

          <button id="draw_button" class="button button_primary" type="submit">오늘의 문장 뽑기</button>
          <div class="button_row">
            <button id="redraw_button" class="button button_ghost" type="button" disabled>다른 문장 보기</button>
            <button id="copy_button" class="button button_ghost" type="button" disabled>문장 복사</button>
          </div>
        </form>
      </section>

      <article id="result_card" class="result_card" aria-live="polite">
        <div class="result_frame">
          <p id="card_empty" class="card_empty">나이, 성별, 오늘의 기분을 고르면 오늘을 위한 짧은 문장이 여기에 나타납니다.</p>
          <div id="card_body" class="card_body" hidden>
            <div class="card_top">
              <div>
                <p id="card_date" class="card_date"></p>
                <p id="card_meta" class="card_meta"></p>
              </div>
              <p id="card_mood" class="card_mood"></p>
            </div>
            <h2 class="card_title">오늘의 격언</h2>
            <p class="sentence_label">오늘을 보내는 법</p>
            <p id="card_lead" class="sentence_lead" tabindex="-1"></p>
            <p class="sentence_label">주의할 점과 있을 수 있는 일</p>
            <p id="card_caution" class="sentence_caution"></p>
          </div>
        </div>
      </article>
    </div>

    <p class="footnote">문장은 미리 준비된 격언 덱에서 고릅니다. 같은 날, 같은 입력이면 같은 문장이 유지됩니다.</p>
  </main>

  <script src="js/constants.js"></script>
  <script src="js/phrases_general.js"></script>
  <script src="js/phrases_child.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/picker.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
